[workspace]
authors = ["dokutoshi <leo@groundswellai.com>"]
channels = ["conda-forge"]
name = "rl_gym"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
pygame = ">=2.6.1,<3"
pip = ">=26.1.2,<27"
numpy = ">=2.4.6,<3"
tqdm = ">=4.68.3,<5"
matplotlib = ">=3.11.0,<4"
ipython = ">=9.15.0,<10"
seaborn = ">=0.13.2,<0.14"
pytorch = ">=2.14.1,<3"
torchvision = ">=0.29.1,<0.30"

[pypi-dependencies]
gymnasium = { version = ">=1.3.0, <2", extras = ["classic-control"] }
pipdeptree = ">=3.1.0, <4"
